  <script>
    (function () {
      var sw = document.getElementById('navSwitch');
      if (!sw) return;
      var btn = sw.querySelector('.nav__switch-btn');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = sw.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function (e) {
        if (!sw.contains(e.target)) {
          sw.classList.remove('is-open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
      sw.addEventListener('mouseleave', function () {
        sw.classList.remove('is-open');
        btn.setAttribute('aria-expanded', 'false');
      });
    })();
  </script>


  <script>
    (function () {
      var pages = Array.prototype.slice.call(document.querySelectorAll('.p-pdf__page'));
      var btns = Array.prototype.slice.call(document.querySelectorAll('.p-rail__btn'));
      if (!pages.length || !btns.length) return;
      function setActive(i) {
        btns.forEach(function (b, idx) { b.classList.toggle('is-active', idx === i); });
        var cur = btns[i];
        if (cur) { cur.scrollIntoView({ block: 'nearest' }); }
      }
      setActive(0);
      var visible = new Set();
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) visible.add(e.target); else visible.delete(e.target);
        });
        if (visible.size) {
          var center = window.innerHeight / 2, best = null, bestDist = Infinity;
          visible.forEach(function (t) {
            var r = t.getBoundingClientRect();
            var d = Math.abs((r.top + r.bottom) / 2 - center);
            if (d < bestDist) { bestDist = d; best = t; }
          });
          var i = pages.indexOf(best);
          if (i >= 0) setActive(i);
        }
      }, { rootMargin: '-20% 0px -20% 0px', threshold: 0 });
      pages.forEach(function (p) { io.observe(p); });
      btns.forEach(function (b) {
        b.addEventListener('click', function () {
          var t = document.getElementById(b.getAttribute('data-target'));
          if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    })();
  </script>
